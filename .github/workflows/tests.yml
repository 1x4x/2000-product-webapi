name: .NET tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ProductAPI.sln
      - name: Build
        run: dotnet build ProductAPI.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test ProductAPI.Tests.Unit/ProductAPI.Tests.Unit.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Integration tests (Docker/MySQL)
        run: dotnet test ProductAPI.Tests.Integration/ProductAPI.Tests.Integration.csproj --no-build --configuration Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
